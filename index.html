<h1>Personal Secretary</h1>
<p>Personal Secretary is a private, single-user tool. It runs on its owner's own computer and reads the owner's own Gmail and Google Calendar to keep his personal to-do list up to date.</p>
<p>It is not offered to the public and has no other users.</p>
